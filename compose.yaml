name: recipe-costing

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: recipe_costing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pantry:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recipe_costing"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/api/RecipeCosting.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RecipeCostingConnection: Host=db;Port=5432;Database=recipe_costing;Username=postgres;Password=postgres
      # Local containers only. A deployed instance is given its own key.
      Auth__SigningKey: development-only-key-for-the-compose-stack
      Database__MigrateOnStart: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pantry:
